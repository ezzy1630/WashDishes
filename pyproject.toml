[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wash-dishes"
version = "0.1.0"
description = "Local kitchen accountability, evidence, and review"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]
vision = ["opencv-python==4.11.0.86", "numpy==1.26.4", "ultralytics==8.4.174", "lap==0.5.12"]

[project.scripts]
washdishes = "wash_dishes.__main__:main"

[tool.setuptools.packages.find]
include = ["wash_dishes*"]

[tool.setuptools.package-data]
wash_dishes = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
